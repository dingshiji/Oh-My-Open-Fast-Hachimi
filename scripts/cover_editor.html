<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双人封面工作台</title>
<style>*{box-sizing:border-box}body{margin:0;background:#19171e;color:#f8edf4;font:15px system-ui,"Microsoft YaHei",sans-serif}header{padding:22px 28px;border-bottom:1px solid #3b3340;display:flex;align-items:center;gap:18px}h1{font-size:20px;margin:0}header span{color:#baaab8;font-size:13px}main{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 72px)}aside{padding:24px;background:#221e27;display:flex;flex-direction:column;gap:20px}label{display:block;color:#dac7d5;font-size:13px;margin-bottom:8px}button,.file{border:1px solid #655062;background:#39303f;border-radius:9px;color:inherit;padding:11px 14px;cursor:pointer;font:inherit;text-align:center;display:block}button:hover,.file:hover{background:#504055}.primary{background:#edadd0;color:#321626;border:0;font-weight:600}.primary:hover{background:#ffd0e9}.row{display:flex;gap:8px}.row>*{flex:1}input[type=range]{width:100%;accent-color:#eeafd1}select{width:100%;padding:10px;border-radius:8px;background:#352b3a;color:inherit;border:1px solid #655062}small{font-size:12px;color:#baaab8;line-height:1.7}#workspace{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:15px;min-width:0}#stage{position:relative;width:100%;max-width:1500px;line-height:0;box-shadow:0 12px 45px #0005;background:#fff}canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}#status{color:#c9b8c6;font-size:13px;text-align:center;line-height:1.7}body.clean header,body.clean aside,body.clean #status{display:none}body.clean main{display:block;min-height:100vh}body.clean #workspace{height:100vh;padding:0}body.clean #stage{box-shadow:none}input[type=file]{display:none}output{float:right;color:#f6c2df}.help{border-top:1px solid #49394a;padding-top:16px}#workspace.over{background:#4a344a}@media(max-width:780px){main{grid-template-columns:1fr}aside{order:2;display:grid;grid-template-columns:1fr 1fr}header span{display:none}#workspace{padding:16px}}</style>
<header><h1>双人封面工作台</h1><span>选一张底图，把笑脸放到喜欢的位置。</span></header><main><aside>
<div><label class="file primary" for="file">＋ 选择底图</label><input id="file" type="file" accept="image/*"><small>也可以拖入图片，或 Ctrl+V 粘贴截图。</small></div>
<div><label>画布比例</label><select id="ratio"><option value="original">跟随底图</option><option value="16:9">16 : 9 视频封面</option><option value="4:3">4 : 3</option><option value="1:1">1 : 1</option></select></div>
<div><label>底图适配</label><select id="fit"><option value="contain">完整显示</option><option value="cover">填满画布（居中裁剪）</option></select></div>
<div><label>头像大小 <output id="sizeValue">42%</output></label><input id="size" type="range" min="8" max="100" value="42"></div>
<div><label>头像旋转 <output id="angleValue">0°</output></label><input id="angle" type="range" min="-45" max="45" value="0"></div>
<div><label>快速放置</label><div class="row"><button data-place="top">上方</button><button data-place="bottom">右下</button></div></div>
<button id="reset">重置头像</button><button id="clean">隐藏工具栏 · H</button><button id="fullscreen">全屏查看</button><button class="primary" id="save">保存封面 PNG</button>
<small class="help">拖动头像调整位置；鼠标滚轮缩放。方向键微调，Shift + 方向键加速。<br>H 隐藏 / 显示工具栏，Esc 恢复。隐藏后仍可拖动头像。<br>完全离线运行，图片不会上传。</small>
</aside><section id="workspace"><div id="stage"><canvas id="canvas" width="1920" height="1080" aria-label="封面画布，可拖动头像"></canvas></div><div id="status">正在加载头像…</div></section></main>
<script>
const avatar=new Image(),bg=new Image(),c=document.getElementById('canvas'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let hasBg=false,ready=false,x=.5,y=.25,size=.42,angle=0,drag=null,currentURL=null;
avatar.src='../assets/private/avatars/duo.png';avatar.onload=()=>{ready=true;draw();status('选择或拖入底图即可开始。')};avatar.onerror=()=>status('头像加载失败，请重新打开网页。');
function status(t){$('status').textContent=t}
function dims(){let ratio=hasBg?bg.naturalWidth/bg.naturalHeight:16/9;const v=$('ratio').value;if(v!=='original'){const p=v.split(':').map(Number);ratio=p[0]/p[1]}c.width=ratio>=1?1920:Math.round(1920*ratio);c.height=ratio>=1?Math.round(1920/ratio):1920;resize()}
function resize(){const w=$('workspace').clientWidth-(document.body.classList.contains('clean')?0:56),h=window.innerHeight-(document.body.classList.contains('clean')?0:160);$('stage').style.maxWidth=Math.max(160,Math.min(w,h*c.width/c.height))+'px'}
function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#f4d3e5';ctx.fillRect(0,0,c.width,c.height);if(hasBg){const k=$('fit').value==='cover'?Math.max(c.width/bg.width,c.height/bg.height):Math.min(c.width/bg.width,c.height/bg.height);ctx.drawImage(bg,(c.width-bg.width*k)/2,(c.height-bg.height*k)/2,bg.width*k,bg.height*k)}if(ready){const w=c.width*size,h=w*avatar.height/avatar.width;ctx.save();ctx.translate(x*c.width,y*c.height);ctx.rotate(angle*Math.PI/180);ctx.drawImage(avatar,-w/2,-h/2,w,h);ctx.restore()}$('sizeValue').textContent=Math.round(size*100)+'%';$('angleValue').textContent=angle+'°'}
function load(file){if(!file)return;if(!file.type.startsWith('image/')&&!/\.(png|jpe?g|webp|avif|gif|bmp)$/i.test(file.name)){status('请选择图片文件。');return}const url=URL.createObjectURL(file);bg.onload=()=>{if(currentURL)URL.revokeObjectURL(currentURL);currentURL=url;hasBg=true;dims();draw();status(file.name+' · '+bg.naturalWidth+' × '+bg.naturalHeight+' → 输出 '+c.width+' × '+c.height)};bg.onerror=()=>{URL.revokeObjectURL(url);status('浏览器无法读取这张图片，请改用 PNG、JPG 或新版 Chrome。')};bg.src=url}
$('file').onchange=e=>load(e.target.files[0]);['ratio','fit'].forEach(id=>$(id).onchange=()=>{dims();draw()});$('size').oninput=e=>{size=+e.target.value/100;draw()};$('angle').oninput=e=>{angle=+e.target.value;draw()};
function place(where){const h=size*c.width*avatar.height/avatar.width/c.height;x=where==='bottom'?1-size/2-.025:.5;y=where==='bottom'?1-h/2-.035:h/2+.035;draw()}
document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>place(b.dataset.place));$('reset').onclick=()=>{size=.42;angle=0;$('size').value=42;$('angle').value=0;place('top')};
function clean(on){document.body.classList.toggle('clean',on);resize()}$('clean').onclick=()=>clean(true);$('fullscreen').onclick=async()=>{try{await document.documentElement.requestFullscreen();clean(true)}catch{clean(true)}};
function point(e){const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
c.onpointerdown=e=>{const[p,q]=point(e),dx=(p-x)*c.width,dy=(q-y)*c.height,a=-angle*Math.PI/180,lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a),w=c.width*size,h=w*avatar.height/avatar.width;if(Math.abs(lx)>w/2||Math.abs(ly)>h/2)return;drag=[p-x,q-y];c.setPointerCapture(e.pointerId);c.classList.add('dragging')};c.onpointermove=e=>{if(!drag)return;const[p,q]=point(e);x=Math.max(0,Math.min(1,p-drag[0]));y=Math.max(0,Math.min(1,q-drag[1]));draw()};function stop(){drag=null;c.classList.remove('dragging')}c.onpointerup=stop;c.onpointercancel=stop;
c.addEventListener('wheel',e=>{e.preventDefault();size=Math.max(.08,Math.min(1,size+(e.deltaY<0?.02:-.02)));$('size').value=size*100;draw()},{passive:false});
window.addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.key.toLowerCase()==='h')clean(!document.body.classList.contains('clean'));if(e.key==='Escape')clean(false);const d=e.shiftKey?10:1;if(e.key.startsWith('Arrow')){e.preventDefault();if(e.key==='ArrowLeft')x-=d/c.width;if(e.key==='ArrowRight')x+=d/c.width;if(e.key==='ArrowUp')y-=d/c.height;if(e.key==='ArrowDown')y+=d/c.height;draw()}});
window.addEventListener('paste',e=>{const f=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'));if(f)load(f.getAsFile())});window.addEventListener('dragover',e=>{e.preventDefault();$('workspace').classList.add('over')});window.addEventListener('drop',e=>{e.preventDefault();$('workspace').classList.remove('over');load(e.dataTransfer.files[0])});window.addEventListener('dragleave',()=> $('workspace').classList.remove('over'));
$('save').onclick=()=>{if(!hasBg){status('请先选择一张底图。');return}c.toBlob(blob=>{if(!blob)return;const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='双人封面.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)},'image/png')};window.addEventListener('resize',resize);dims();
</script></html>
